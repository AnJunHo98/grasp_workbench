[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-workbench"
version = "0.1.0"
description = "Minimal independent camera workers connected by iceoryx2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "iceoryx2==0.9.3", "PyYAML>=6,<7"]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.50,<3"]
ui = ["PyQt6>=6.7,<7", "matplotlib>=3.8,<4", "fast-simplification>=0.1,<0.2", "trimesh>=4,<5"]
sam3 = ["pillow>=10", "einops>=0.8", "pycocotools>=2", "scipy>=1.10", "psutil>=5",
        "opencv-python-headless>=4.8,<4.12", "setuptools>=61,<81"]
sam3d = ["hydra-core>=1.3,<1.4", "omegaconf>=2.3,<3", "pillow>=10", "trimesh>=4,<5"]
foundationpose = ["trimesh>=4,<5"]
graspgenx = ["trimesh>=4,<5", "omegaconf>=2.3,<3"]
vlm = ["openai>=2,<3", "pillow>=10"]
vlm-anthropic = ["anthropic>=1,<2", "pillow>=10"]
test = ["pytest>=7", "pillow>=10"]

[project.scripts]
grasp-workbench = "grasp_workbench.main:main"

[tool.setuptools.packages.find]
include = ["grasp_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
